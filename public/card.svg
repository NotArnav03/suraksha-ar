  <text x="105" y="194.0" font-size="7" font-weight="700" font-family="system-ui, sans-serif" fill="#15140c" text-anchor="middle">Suraksha AR · Card AR</text>
  <text x="105" y="205.0" font-size="4.6" font-family="system-ui, sans-serif" fill="#15140c" text-anchor="middle">Lay the card flat on a table, open the drill, and point the phone at it.</text>
  <text x="105" y="213.0" font-size="4.6" font-family="system-ui, sans-serif" fill="#15140c" text-anchor="middle">कार्ड को मेज़ पर सीधा रखिए, अभ्यास खोलिए और फ़ोन का कैमरा उस पर रखिए।</text>
  <text x="105" y="225.0" font-size="3.6" fill="#555" text-anchor="middle" font-family="system-ui, sans-serif">Print at 100% (no "fit to page"). Keep the black frame whole, flat and unfolded, and the white border around it.</text>
